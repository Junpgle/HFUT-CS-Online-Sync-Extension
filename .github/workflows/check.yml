name: Extension checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check shared.js
          node --check content.js
          node --check popup.js
          node --check background.js
      - name: Record merge tests
        run: node tests/test-shared.cjs
      - name: Two-device integration tests
        run: node tests/test-content.cjs
      - name: Quota and course management tests
        run: node tests/test-popup.cjs
      - name: Question-Bank cloud transport tests
        run: node tests/test-background.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline Edge publish API tests
        run: python tests/test_publish_edge.py
      - name: Build Microsoft Edge store package
        run: python scripts/package_edge.py
      - name: Verify Microsoft Edge store package
        run: python scripts/verify_edge_package.py dist/*.zip
      - name: Independently decode released PNGs with Pillow
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image
          packages = list(Path("dist").glob("*.zip"))
          assert len(packages) == 1, packages
          with ZipFile(packages[0]) as archive:
              for n in (16, 48, 128):
                  name = f"icons/icon{n}.png"
                  raw = archive.read(name)
                  with Image.open(BytesIO(raw)) as img:
                      img.load()
                      assert img.size == (n, n) and img.mode == "RGBA", (name, img.size, img.mode)
                  print(f"PASS: {name} fully decoded as RGBA")
          PY
      - name: Upload validated Edge package
        uses: actions/upload-artifact@v4
        with:
          name: Edge-Addons-Upload-Package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
