name: Repair runtime icons (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoder and encoder
        run: python -m pip install Pillow==11.3.0
      - name: Re-encode all runtime icons as RGBA PNG and validate
        run: python scripts/repair_icons.py
      - name: Commit repaired PNG binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon16.png icons/icon48.png icons/icon128.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(icons): replace indexed PNG assets with decoder-verified RGBA"
            git push origin HEAD:main
          else
            echo "No icon changes"
          fi
